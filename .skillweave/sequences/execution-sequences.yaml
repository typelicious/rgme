version: "1.0"
sequence_id: "rgme-milestone-1-execution"
project: "Retro Game Modernization Engine (RGME)"
methodology: "assay"
autonomy_policy: "unicorn"
session_schedule: "batch"
parallelism: "maximal"
target_budget: "15 USD (Claude Cloud)"

execution_envelope:
  max_iterations_per_task: 3
  stop_on_gate_failure: false
  evidence_required: true
  autonomy: "full_optimistic_assumptions"

batches:
  - id: "batch-01-scaffold"
    name: "Monorepo Scaffold & Infrastructure"
    tasks: ["ARCH-001"]
    status: "completed"
    parallel: false
    gate:
      command: "pnpm build && pnpm test"
      expected: "clean build and test run"

  - id: "batch-02-parallel-core-and-apps"
    name: "Maximal Parallel Execution: Core, CLI & UI"
    description: "In Unicorn mode with Assay methodology, develop Core schemas, Mock Adapter, CLI scanner, and Web UI concurrently."
    tasks: ["CORE-001", "CORE-002", "CLI-001", "UI-001"]
    parallel: true
    depends_on: ["batch-01-scaffold"]
    gate:
      command: "pnpm build && pnpm test"
      expected: "100% test pass on all workspace packages"

  - id: "batch-03-integration"
    name: "E2E Verification & Demonstrator"
    tasks: ["INTEG-001"]
    parallel: false
    depends_on: ["batch-02-parallel-core-and-apps"]
    gate:
      command: "pnpm test && pnpm build"
      expected: "Full monorepo integration passes with zero warnings/errors"
