<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Copperline Amiga WebAssembly Core</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      display: block;
      cursor: crosshair;
    }
    #loading {
      position: absolute;
      color: #55ff55;
      font-family: monospace;
      font-size: 16px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="loading">Initializing Copperline (Rust/WASM)…</div>
  <canvas id="screen" width="720" height="568"></canvas>

  <script type="module">
    import init, { WebEmu } from './pkg/copperline_web.js';

    (async function() {
      const loadingEl = document.getElementById('loading');
      const canvas = document.getElementById('screen');
      const ctx = canvas.getContext('2d');

      let wasm = null;
      let emu = null;
      let running = true;
      let muted = false;
      let frameCount = 0;
      let audioCtx = null;
      let audioNode = null;
      let pendingDisk = null;
      let pendingRom = null;
      let activeRom = null;
      let defaultRomBytes = null;
      let defaultExtBytes = null;
      let lastFloppy = null;
      let currentModel = "A500";
      const joyState = { up: false, down: false, left: false, right: false, fire: false, fire2: false };

      function detectMachineModel(romBytes, requestedModel) {
        if (requestedModel) {
          const m = requestedModel.toUpperCase();
          if (m.includes("1200")) return "A1200";
          if (m.includes("PLUS")) return "A500Plus";
          if (m.includes("600")) return "A600";
          if (m.includes("1000")) return "A1000";
          if (m.includes("3000")) return "A3000";
          if (m.includes("4000")) return "A4000";
          if (m.includes("CD32")) return "CD32";
        }
        if (romBytes && romBytes.length >= 524288) {
          let hay = "";
          try {
            const head = new TextDecoder('latin1').decode(romBytes.subarray(0, 8192));
            const tail = new TextDecoder('latin1').decode(romBytes.subarray(romBytes.length - 8192));
            hay = head + tail;
          } catch(e) {}
          if (hay.includes("A600") || hay.includes("Gayle")) return "A600";
          if (hay.includes("A1200") || hay.includes("AGA")) return "A1200";
        }
        return "A500";
      }

      // Audio pacing & queue backpressure
      const AUDIO_GATE_CLOSE_MS = 150;
      const AUDIO_GATE_OPEN_MS = 90;
      let audioGateClosed = false;
      let queuedMs = 0;

      function maxFramesForQueue() {
        const limit = audioGateClosed ? AUDIO_GATE_OPEN_MS : AUDIO_GATE_CLOSE_MS;
        audioGateClosed = queuedMs > limit;
        if (audioGateClosed) {
          if (emu && typeof emu.resync_clock === 'function') emu.resync_clock();
          return 0;
        }
        return 5;
      }

      function setupEmulator(targetModel, rom, ext) {
        if (emu) {
          try { emu.free(); } catch(e) {}
          emu = null;
        }
        currentModel = targetModel;
        emu = new WebEmu(currentModel, 'PAL', 2);
        queuedMs = 0;
        audioGateClosed = false;
        if (typeof emu.resync_clock === 'function') emu.resync_clock();

        if (rom) {
          emu.load_rom(rom, ext || null);
        } else if (defaultRomBytes) {
          emu.load_rom(defaultRomBytes, defaultExtBytes);
        }
        if (lastFloppy) {
          try {
            emu.insert_floppy(0, lastFloppy.bytes, lastFloppy.fileName);
            emu.reset();
            if (typeof emu.resync_clock === 'function') emu.resync_clock();
          } catch(e) {
            console.error("Floppy insertion error in setupEmulator:", e);
          }
        }
        window.parent.postMessage({ rgme: "copperline", type: "ready", model: currentModel }, "*");
      }

      // Audio setup (Paula 4-channel output via AudioWorklet)
      async function initAudio() {
        if (audioCtx) {
          if (audioCtx.state === 'suspended') {
            try { await audioCtx.resume(); } catch(e) {}
          }
          return;
        }
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC({ sampleRate: 44100 });
          try {
            await audioCtx.audioWorklet.addModule('./audio-worklet.js');
            audioNode = new AudioWorkletNode(audioCtx, 'copperline-audio', {
              outputChannelCount: [2]
            });
            audioNode.port.onmessage = function(e) {
              if (typeof e.data?.queuedMs === 'number') {
                queuedMs = e.data.queuedMs;
              }
            };
            audioNode.connect(audioCtx.destination);
          } catch(e) {
            console.warn("AudioWorklet unavailable:", e);
          }
        } catch(err) {
          console.warn("Could not start audio context", err);
        }
      }

      // Early message listener so no parent commands are missed during WASM init
      window.addEventListener("message", function(e) {
        if (!e.data || e.data.rgme !== "copperline_cmd") return;
        const cmd = e.data.cmd;

        if (cmd === "load") {
          const bytes = e.data.bytes instanceof Uint8Array ? e.data.bytes : new Uint8Array(e.data.bytes);
          const fileName = e.data.fileName || "disk.adf";
          lastFloppy = { bytes, fileName };
          const requestedModel = e.data.model;
          if (requestedModel && requestedModel !== currentModel && wasm) {
            setupEmulator(requestedModel, activeRom, activeRom ? null : defaultExtBytes);
            return;
          }
          if (emu) {
            try {
              emu.insert_floppy(0, bytes, fileName);
              emu.reset(); // Crucial! Cold boots the newly inserted media
              queuedMs = 0;
              audioGateClosed = false;
              if (typeof emu.resync_clock === 'function') emu.resync_clock();
            } catch(err) {
              console.error("Floppy insertion error:", err);
            }
          } else {
            pendingDisk = { bytes, fileName };
          }
        } else if (cmd === "load_rom") {
          if (e.data.bytes) {
            const rom = e.data.bytes instanceof Uint8Array ? e.data.bytes : new Uint8Array(e.data.bytes);
            activeRom = rom;
            const targetModel = detectMachineModel(rom, e.data.model);
            if (emu) {
              if (targetModel !== currentModel) {
                setupEmulator(targetModel, rom, null);
              } else {
                try {
                  emu.load_rom(rom, null);
                  if (lastFloppy) {
                    emu.insert_floppy(0, lastFloppy.bytes, lastFloppy.fileName);
                  }
                  emu.reset();
                  queuedMs = 0;
                  audioGateClosed = false;
                  if (typeof emu.resync_clock === 'function') emu.resync_clock();
                } catch(err) {
                  console.error("ROM load error:", err);
                }
              }
            } else {
              pendingRom = rom;
            }
          }
        } else if (cmd === "play" || cmd === "start") {
          running = true;
          initAudio();
          queuedMs = 0;
          audioGateClosed = false;
          if (emu && typeof emu.resync_clock === 'function') emu.resync_clock();
        } else if (cmd === "pause") {
          running = false;
          if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
        } else if (cmd === "reset") {
          if (emu) {
            emu.reset();
            queuedMs = 0;
            audioGateClosed = false;
            if (typeof emu.resync_clock === 'function') emu.resync_clock();
          }
        } else if (cmd === "setMuted") {
          muted = Boolean(e.data.muted);
        } else if (cmd === "input") {
          const action = e.data.action;
          const down = Boolean(e.data.pressed !== undefined ? e.data.pressed : e.data.down);
          if (action in joyState) {
            joyState[action] = down;
            if (emu) {
              emu.set_joystick_port(2, joyState.up, joyState.down, joyState.left, joyState.right, joyState.fire, joyState.fire2);
            }
          }
        }
      });

      // Load WASM and ROMs
      try {
        loadingEl.textContent = "Loading Copperline WASM…";
        wasm = await init('./pkg/copperline_web_bg.wasm');

        loadingEl.textContent = "Loading bundled AROS Kickstart…";
        const [romRes, extRes] = await Promise.all([
          fetch('./aros/aros-amiga-m68k-rom.bin'),
          fetch('./aros/aros-amiga-m68k-ext.bin')
        ]);
        defaultRomBytes = new Uint8Array(await romRes.arrayBuffer());
        defaultExtBytes = new Uint8Array(await extRes.arrayBuffer());

        const targetModel = detectMachineModel(pendingRom, null);
        currentModel = targetModel;
        emu = new WebEmu(currentModel, 'PAL', 2);
        if (pendingRom) {
          activeRom = pendingRom;
          emu.load_rom(pendingRom, null);
        } else {
          emu.load_rom(defaultRomBytes, defaultExtBytes);
        }

        if (pendingDisk) {
          lastFloppy = pendingDisk;
          try {
            emu.insert_floppy(0, pendingDisk.bytes, pendingDisk.fileName);
            emu.reset();
            queuedMs = 0;
            audioGateClosed = false;
            if (typeof emu.resync_clock === 'function') emu.resync_clock();
          } catch(err) {
            console.error("Floppy insertion error:", err);
          }
        }

        loadingEl.style.display = 'none';

        // Notify parent RGME adapter that the emulator is loaded and ready
        window.parent.postMessage({ rgme: "copperline", type: "ready", model: currentModel }, "*");
      } catch (err) {
        console.error("Failed to load Copperline:", err);
        loadingEl.textContent = "Failed to load Copperline: " + (err.message || err);
        loadingEl.style.color = "#ff5555";
        return;
      }

      // Render loop with audio-gate pacing, presentation revision checks & zero-GC canvas blitting
      let cachedImgData = null;
      let lastRevision = null;
      let lastReportedFrame = 0;

      function loop() {
        if (emu && running) {
          try {
            const max = maxFramesForQueue();
            const stepped = emu.run(performance.now(), max);

            if (stepped > 0) {
              frameCount += stepped;

              // Audio output (drain Paula audio produced by emulated step)
              const audio = emu.take_audio();
              if (!muted && audio && audio.length > 0 && audioNode) {
                audioNode.port.postMessage(audio, [audio.buffer]);
              }

              if (frameCount - lastReportedFrame >= 50) {
                lastReportedFrame = frameCount;
                window.parent.postMessage({ rgme: "copperline", type: "frame", frame: frameCount, fps: 50 }, "*");
              }
            }

            // Only repaint if the emulator produced a new presentation revision
            const hasRevision = typeof emu.presentation_revision === 'function';
            const revision = hasRevision ? emu.presentation_revision() : null;
            const changed = hasRevision ? (revision !== lastRevision) : (stepped > 0);

            if (changed) {
              if (hasRevision) lastRevision = revision;
              const ptr = emu.present_ptr();
              const width = emu.present_width();
              const rows = emu.present_rows();

              if (ptr && width > 0 && rows > 0) {
                if (canvas.width !== width || canvas.height !== rows) {
                  canvas.width = width;
                  canvas.height = rows;
                  cachedImgData = null;
                }
                if (!cachedImgData || cachedImgData.width !== width || cachedImgData.height !== rows) {
                  cachedImgData = ctx.createImageData(width, rows);
                }
                const view = new Uint8ClampedArray(wasm.memory.buffer, ptr, width * rows * 4);
                cachedImgData.data.set(view);
                ctx.putImageData(cachedImgData, 0, 0);
              }
            }
          } catch(err) {
            console.error("Copperline execution error:", err);
          }
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      // User gesture unlock for audio and mouse pointer lock
      canvas.addEventListener("click", function() {
        initAudio();
        try { canvas.requestPointerLock?.(); } catch(e) {}
      });
      window.addEventListener("click", function() {
        initAudio();
      });

      // Mouse input to Amiga
      canvas.addEventListener("mousemove", function(e) {
        if (emu && document.pointerLockElement === canvas) {
          emu.mouse_delta(e.movementX, e.movementY);
        }
      });
      canvas.addEventListener("mousedown", function(e) {
        if (emu) emu.mouse_button(e.button, true);
      });
      canvas.addEventListener("mouseup", function(e) {
        if (emu) emu.mouse_button(e.button, false);
      });

      // Keyboard input to Amiga
      window.addEventListener("keydown", function(e) {
        if (emu) {
          const handled = emu.key_event(e.code, true);
          if (handled) e.preventDefault();
        }
      });
      window.addEventListener("keyup", function(e) {
        if (emu) {
          const handled = emu.key_event(e.code, false);
          if (handled) e.preventDefault();
        }
      });
    })();
  </script>
</body>
</html>
